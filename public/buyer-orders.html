<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Orders - AgroSmart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Mobile Toggle -->
  <button id="sidebarToggle" onclick="document.getElementById('buyerSidebar').classList.toggle('show')">☰</button>

  <!-- Buyer Sidebar -->
  <aside class="sidebar" id="buyerSidebar">
    <div class="sidebar-header">
      <a href="home.html">AgroSmart</a>
    </div>
    <div class="sidebar-menu">
      <a href="marketplace-home.html" class="sidebar-link">
        <span class="icon">🏠</span> <span>Marketplace Home</span>
      </a>
      <a href="index.html" class="sidebar-link">
        <span class="icon">🥬</span> <span data-i18n="nav_market">Marketplace</span>
      </a>
      <a href="cart.html" class="sidebar-link">
        <span class="icon">🛒</span>
        <span>My Cart <span id="sidebarCartCount" class="badge bg-danger rounded-pill ms-1" style="display:none;">0</span></span>
      </a>
      <a href="buyer-orders.html" class="sidebar-link active">
        <span class="icon">📦</span> <span data-i18n="my_orders_title">My Orders</span>
      </a>
    </div>
    <div class="sidebar-footer">
      <div id="navUser" class="mb-2 text-center small" style="color: var(--secondary);"></div>
      <button class="btn btn-sm btn-danger w-100" onclick="logout()" data-i18n="nav_logout">Logout</button>
    </div>
  </aside>

  <main class="main-content p-0">
    <header class="top-header">
      <div class="d-flex align-items-center d-lg-none">
        <button class="btn btn-light border-0 me-3 p-2" onclick="document.getElementById('buyerSidebar').classList.toggle('show')">☰</button>
        <span class="fw-bold fs-5 text-success">AgroSmart</span>
      </div>
      <div class="d-none d-lg-block fw-bold text-dark fs-5" data-i18n="my_orders_title">My Orders</div>

      <div class="header-search d-none d-md-flex mx-auto">
        <span class="text-muted">🔍</span>
        <input type="text" placeholder="Search Orders..." />
      </div>

      <div class="header-actions">
        <a href="cart.html" class="icon-btn text-decoration-none" title="View Cart" style="position:relative;">
          🛒
          <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger border border-light" style="font-size:0.6rem; display:none;">0</span>
        </a>
        <div class="user-profile">
          <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center" id="userAvatar" style="width: 32px; height: 32px; font-weight: bold;">B</div>
          <span class="d-none d-md-block fw-bold text-dark" id="navUserHeader">Buyer</span>
        </div>
      </div>
    </header>

    <div class="container-fluid py-4 px-md-5 animate-fade">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="text-success fw-bold mb-1" data-i18n="my_orders_title">Your Orders 📦</h3>
          <p class="text-muted mb-0 small">Track all your purchases from AgroSmart farmers</p>
        </div>
        <a href="index.html" class="btn btn-outline-success btn-sm">Continue Shopping →</a>
      </div>

      <div class="card p-0 border-0 shadow-sm overflow-hidden">
        <div id="buyerOrders" class="table-responsive"></div>
      </div>
    </div>

    <div class="footer">© AgroSmart 2025</div>
  </main>

  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const cart = JSON.parse(localStorage.getItem('agroCart') || '[]');
      const total = cart.reduce((s, i) => s + i.qty, 0);
      if (total > 0) {
        const sb = document.getElementById('sidebarCartCount');
        if (sb) { sb.textContent = total; sb.style.display = 'inline'; }
      }
      const user = JSON.parse(localStorage.getItem('agroUser') || 'null');
      if (user) {
        const header = document.getElementById('navUserHeader');
        const avatar = document.getElementById('userAvatar');
        if (header) header.textContent = user.username;
        if (avatar) avatar.textContent = user.username[0].toUpperCase();
        const navUser = document.getElementById('navUser');
        if (navUser) navUser.textContent = '👤 ' + user.username;
      }
    });
  </script>
</body>

</html>
