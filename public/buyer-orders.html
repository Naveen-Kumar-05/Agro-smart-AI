<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders - AgroSmart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .orders-hero { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: var(--radius-lg); padding: 2rem 2.5rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
    .orders-hero::after { content: '📦'; position: absolute; right: 2rem; top: 50%; transform: translateY(-50%); font-size: 5rem; opacity: 0.1; }
  </style>
</head>
<body>
  <button id="sidebarToggle" onclick="document.getElementById('buyerSidebar').classList.toggle('show')">☰</button>

  <aside class="sidebar" id="buyerSidebar">
    <div class="sidebar-header"><a href="home.html">AgroSmart</a></div>
    <div class="sidebar-menu">
      <a href="marketplace-home.html" class="sidebar-link"><span class="icon">🏠</span><span>Dashboard</span></a>
      <a href="index.html" class="sidebar-link"><span class="icon">🥬</span><span>Marketplace</span></a>
      <a href="cart.html" class="sidebar-link"><span class="icon">🛒</span><span>My Cart <span id="sidebarCartCount" class="badge bg-danger rounded-pill ms-1" style="display:none;">0</span></span></a>
      <a href="buyer-orders.html" class="sidebar-link active"><span class="icon">📦</span><span>My Orders</span></a>
    </div>
    <div class="sidebar-footer">
      <div id="navUser" class="mb-2 text-center small"></div>
      <button class="btn btn-sm btn-danger w-100" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content p-0">
    <header class="top-header">
      <div class="d-flex align-items-center d-lg-none">
        <button class="btn btn-light border-0 me-3 p-2" onclick="document.getElementById('buyerSidebar').classList.toggle('show')">☰</button>
        <span class="fw-bold fs-5 text-success">AgroSmart</span>
      </div>
      <div class="d-none d-lg-block fw-bold text-dark fs-5">My Orders</div>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn text-decoration-none" style="position:relative;">
          🛒
          <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger border border-light" style="font-size:0.6rem;display:none;">0</span>
        </a>
        <div class="user-profile">
          <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" id="userAvatar" style="width:34px;height:34px;">B</div>
          <span class="d-none d-md-block fw-bold text-dark" id="navUserHeader">Buyer</span>
        </div>
      </div>
    </header>

    <div class="container-fluid py-4 px-md-5 animate-fade">
      <div class="orders-hero">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <h3 class="fw-bold text-dark mb-1">Your Orders 📦</h3>
            <p class="text-muted mb-0 small">Track all your purchases from AgroSmart farmers</p>
          </div>
          <a href="index.html" class="btn btn-success btn-sm fw-bold px-4">Continue Shopping →</a>
        </div>
      </div>

      <div class="card border-0 shadow-sm overflow-hidden" style="border-radius:var(--radius);">
        <div id="buyerOrders" class="table-responsive"></div>
      </div>
    </div>

    <div class="footer">© AgroSmart 2025 · Built for Tamil Nadu Farmers</div>
  </main>

  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const user = JSON.parse(localStorage.getItem('agroUser') || 'null');
      if (user) {
        if (document.getElementById('navUserHeader')) document.getElementById('navUserHeader').textContent = user.username;
        if (document.getElementById('userAvatar')) document.getElementById('userAvatar').textContent = user.username[0].toUpperCase();
        if (document.getElementById('navUser')) document.getElementById('navUser').textContent = '👤 ' + user.username;
      }
    });
  </script>
</body>
</html>
